<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SiSehat</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-color: rgba(22, 24, 30, 0.7);
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: rgba(255, 255, 255, 0.08);
            --error-color: #ff4d4d;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing Background Orbs */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 1;
            opacity: 0.15;
        }
        .orb-left {
            top: -100px;
            left: -100px;
            background: var(--primary-color);
            animation: floatLeft 20s infinite alternate;
        }
        .orb-right {
            bottom: -100px;
            right: -100px;
            background: #8a2be2;
            animation: floatRight 20s infinite alternate;
        }

        @keyframes floatLeft {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }
        @keyframes floatRight {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -50px) scale(1.1); }
        }

        /* Container Card */
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 24px;
            z-index: 10;
        }

        .login-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .login-card:hover {
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 20px 40px rgba(0, 242, 254, 0.05);
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo-icon {
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            font-size: 16px;
            transition: all 0.2s;
        }
        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 16px 16px 48px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(0, 242, 254, 0.1);
        }
        .form-input:focus + .input-icon {
            color: var(--primary-color);
        }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }
        .btn-submit:active {
            transform: translateY(0);
        }

        /* Alerts */
        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 24px;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }
        .alert-error {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.2);
            color: var(--error-color);
            display: none;
        }

        .card-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .card-footer a:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Orbs -->
    <div class="orb orb-left"></div>
    <div class="orb orb-right"></div>

    <div class="login-container">
        <div class="login-card">
            
            <div class="logo-row">
                <i class="fa-solid fa-heart-pulse logo-icon"></i>
                <span class="logo-text">SiSehat</span>
            </div>

            <div class="login-header">
                <h1 class="login-title">Selamat Datang</h1>
                <p class="login-subtitle">Masuk ke Dasbor Organisasi Anda</p>
            </div>

            <!-- Error Box -->
            <div class="alert alert-error" id="errorBox">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessage">Email atau kata sandi tidak valid.</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Alamat Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="nama@perusahaan.com" required autocomplete="email">
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Kata Sandi</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan kata sandi" required autocomplete="current-password">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">Masuk Sekarang</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>

            <div class="card-footer">
                Belum terdaftar? <a href="register.html">Buat akun Owner</a>
            </div>

        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://pandarahealth.infinityfree.me/api';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Reset States
            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = 'Menghubungkan...';
            btnSpinner.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || data.message || 'Gagal masuk. Silakan periksa kembali email & sandi Anda.');
                }

                // Suksess - Simpan sesi login secara cerdas di localStorage
                localStorage.setItem('sisehat_user', JSON.stringify(data.data));
                
                // Redirect ke Dashboard visual
                window.location.href = 'dashboard.html';

            } catch (err) {
                // Tampilkan Error
                errorBox.style.display = 'flex';
                errorMessage.textContent = err.message;
                
                // Restore Button States
                submitBtn.disabled = false;
                btnText.textContent = 'Masuk Sekarang';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
